# Werbe- und Tracking-Blocker für das ganze Heimnetz mit AdGuard Home.
#
# Läuft nur im Heimnetz: Alle Ports sind an die LAN-Adressen des Mini-PCs gebunden
# (ADGUARD_IP und ADGUARD_IP6 in .env) – weder aus dem Internet noch über den Tunnel erreichbar.
# Die IPv6-Adresse ist nötig, weil die FritzBox DNS-Anfragen auch über IPv6 weiterleitet.
# Die FritzBox leitet ihre DNS-Anfragen hierher (siehe README).

name: adguard

services:
  adguard:
    container_name: adguard
    image: docker.io/adguard/adguardhome:latest
    restart: always
    ports:
      - '${ADGUARD_IP}:53:53/tcp'
      - '${ADGUARD_IP}:53:53/udp'
      # IPv6 (lokale fd…-Adresse des Mini-PCs). Ohne ADGUARD_IP6 nur auf ::1 (wirkungslos).
      - '[${ADGUARD_IP6:-::1}]:53:53/tcp'
      - '[${ADGUARD_IP6:-::1}]:53:53/udp'
      # Einrichtungsassistent (nur beim ersten Start nötig)
      - '${ADGUARD_IP}:3000:3000/tcp'
      # Weboberfläche nach der Einrichtung
      - '${ADGUARD_IP}:3080:80/tcp'
    volumes:
      - ./conf:/opt/adguardhome/conf
      - ./work:/opt/adguardhome/work
