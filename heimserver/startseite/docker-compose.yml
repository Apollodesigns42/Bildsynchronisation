# Startseite (Homepage) mit Links und Status aller Dienste – nur im Heimnetz.
#
# Alle Ports sind an die LAN-Adresse gebunden (HOMEPAGE_IP in .env), also weder aus dem
# Internet noch über den WireGuard-Tunnel erreichbar. Die Dienste-Liste erzeugt install.sh.

name: homepage

services:
  homepage:
    container_name: homepage
    image: ghcr.io/gethomepage/homepage:latest
    restart: always
    ports:
      - '${HOMEPAGE_IP}:3010:3000'
    volumes:
      - ./config:/app/config
      # Nur lesend, für die Anzeige des freien Speichers. Ein beliebiger Ordner der
      # Systemplatte genügt – "/" im Container wäre Dockers eigenes Dateisystem.
      - /var/lib/heimserver:/mnt/system:ro
      - /mnt/daten:/mnt/daten:ro
      # Status des Werbefilters (von werbefilter-status.sh geschrieben) für die Kachel „Werbeblocker“
      - ./status:/app/public/status:ro
    environment:
      HOMEPAGE_ALLOWED_HOSTS: ${HOMEPAGE_IP}:3010
      PUID: '1000'
      PGID: '1000'

  # Gibt der Startseite nur Lesezugriff auf die Container-Liste (läuft / gestoppt),
  # statt ihr den vollen Docker-Zugang zu geben. Kein Port nach außen.
  dockerproxy:
    container_name: homepage_dockerproxy
    image: ghcr.io/tecnativa/docker-socket-proxy:latest
    restart: always
    environment:
      CONTAINERS: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
