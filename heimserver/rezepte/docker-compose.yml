# Rezepte, Wochenplan und gemeinsame Einkaufsliste mit Mealie.
#
# Basiert auf der offiziellen SQLite-Konfiguration:
#   https://docs.mealie.io/documentation/getting-started/installation/sqlite/
# HTTPS übernimmt der VPS; hier läuft Mealie unverschlüsselt hinter dem WireGuard-Tunnel.
# Konfiguration in .env.

name: mealie

services:
  mealie:
    container_name: mealie
    # Feste Version (Empfehlung des Mealie-Teams). Update: MEALIE_VERSION in .env erhöhen,
    # vorher die Release Notes lesen: https://github.com/mealie-recipes/mealie/releases
    image: ghcr.io/mealie-recipes/mealie:${MEALIE_VERSION:-v3.30.0}
    restart: always
    ports:
      # Im Heimnetz und über den WireGuard-Tunnel erreichbar. Die FritzBox gibt den Port NICHT frei.
      - '9925:9000'
    deploy:
      resources:
        limits:
          # Empfehlung von Mealie, sonst reserviert Python unnötig viel Speicher
          memory: 1000M
    volumes:
      - ${MEALIE_DATA_DIR:-./data}:/app/data/
    environment:
      BASE_URL: https://${MEALIE_DOMAIN}
      ALLOW_SIGNUP: 'false'
      PUID: '1000'
      PGID: '1000'
      TZ: Europe/Berlin
      # Weitergeleitete Absender-Adressen nur vom VPS (Tunnel) glauben
      HOST_IP: 10.77.0.1
