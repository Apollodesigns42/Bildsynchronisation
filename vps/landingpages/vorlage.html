<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>__DOMAIN__</title>
<style>
  :root { --bg: #f6f5f2; --fg: #1d1d1f; --muted: #6e6e73; --line: #d9d6cf; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141416; --fg: #f2f2f2; --muted: #9a9aa0; --line: #2e2e33; }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: var(--bg); color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { text-align: center; max-width: 36rem; }
  h1 { font-size: clamp(2rem, 7vw, 3.5rem); font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
  hr { width: 3rem; border: 0; border-top: 2px solid var(--line); margin: 1.5rem auto; }
  p { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>__DOMAIN__</h1>
  <hr>
  <p>Hier entsteht etwas Neues.</p>
</main>
</body>
</html>
